{% extends "portfolio/base.html" %}

{% block content %}
<h2>Entrar com link magico</h2>

{% if messages %}
  {% for message in messages %}
    <p>{{ message }}</p>
  {% endfor %}
{% endif %}

<p>Insere o teu email para receberes um link de acesso.</p>

<form method="POST">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Enviar link de acesso</button>
</form>
{% endblock %}
