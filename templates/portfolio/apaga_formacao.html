<!-- templates/portfolio/apaga_formacao.html -->

{% extends "portfolio/base.html" %} {% block content %}
<h2>Apagar formacao</h2>

<article>
  <header>
    <h3>{{ formacao.titulo }}</h3>
    <p>Esta acao nao pode ser anulada.</p>
  </header>

  <form action="{% url 'apaga_formacao' formacao.id %}" method="post">
    {% csrf_token %}
    <button class="button-danger" type="submit">Confirmar apagar</button>
    <a class="button button-secondary" href="{% url 'portfolio_formacoes' %}">Cancelar</a>
  </form>
</article>
{% endblock %}
