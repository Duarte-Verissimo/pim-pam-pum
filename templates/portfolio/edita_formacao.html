<!-- templates/portfolio/edita_formacao.html -->

{% extends "portfolio/base.html" %} {% block content %}
<h2>Edita formacao</h2>

<form action="{% url 'edita_formacao' formacao.id %}" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Guardar alteracoes</button>
  <a class="button button-secondary" href="{% url 'portfolio_formacoes' %}">Cancelar</a>
</form>
{% endblock %}
